<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #090c0a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 50%, #17241c 0%, #080c09 85%);
      }
      .glow-ring {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 82, 0, 0.22) 0%, rgba(255, 82, 0, 0) 70%);
        filter: blur(40px);
        transform: scale(0.6);
        opacity: 0;
      }
      .wheel-center {
        position: relative;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 2px solid rgba(255, 255, 255, 0.22);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 25px rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: scale(0.2) rotate(-90deg);
        opacity: 0;
      }
      .hub {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: #ff5200;
        box-shadow: 0 8px 24px rgba(255, 82, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 34px;
        font-weight: 800;
      }
      .petal {
        position: absolute;
        width: 78px;
        height: 34px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.92);
        color: #111314;
        font-size: 13px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
        letter-spacing: 0.5px;
      }
      .p1 { top: 12px; left: 121px; }
      .p2 { top: 62px; right: 14px; }
      .p3 { bottom: 62px; right: 14px; }
      .p4 { bottom: 12px; left: 121px; }
      .p5 { bottom: 62px; left: 14px; }
      .p6 { top: 62px; left: 14px; }
      .tagline-box {
        margin-top: 48px;
        text-align: center;
        opacity: 0;
        transform: translateY(20px);
      }
      .main-title {
        color: #ffffff;
        font-size: 58px;
        font-weight: 800;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .badge {
        padding: 6px 14px;
        background: #ff5200;
        color: #ffffff;
        font-size: 16px;
        font-weight: 700;
        border-radius: 12px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
      }
      .sub-title {
        color: #9ea8a0;
        font-size: 24px;
        font-weight: 500;
        margin-top: 10px;
      }
      .action-pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
        padding: 12px 28px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.25);
        color: #f0f4f1;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }
      .kbd {
        background: #ffffff;
        color: #111314;
        padding: 3px 10px;
        border-radius: 8px;
        font-weight: 800;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1920"
      data-height="1080"
    >
      <div id="glow" class="glow-ring"></div>
      
      <div id="wheel" class="wheel-center">
        <div class="petal p1">PNG</div>
        <div class="petal p2">WEBP</div>
        <div class="petal p3">MP4</div>
        <div class="petal p4">PDF</div>
        <div class="petal p5">TRIM</div>
        <div class="petal p6">JPG</div>
        <div class="hub">🎡</div>
      </div>

      <div id="tagline" class="tagline-box">
        <h1 class="main-title">LuckyWheel <span class="badge">v1.0.0</span></h1>
        <p class="sub-title">Zero-Click Radial File Converter for Windows & macOS</p>
        <div class="action-pill">
          Select any file in Explorer <span class="kbd">⇧ Shift</span> Instant Radial Wheel
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#glow", { opacity: 1, scale: 1.2, duration: 1.2, ease: "power2.out" }, 0.2);
      tl.to("#wheel", { opacity: 1, scale: 1, rotate: 0, duration: 1.0, ease: "back.out(1.7)" }, 0.4);
      tl.to(".petal", { scale: 1.08, stagger: 0.1, duration: 0.4, yoyo: true, repeat: 1, ease: "power1.inOut" }, 1.3);
      tl.to("#tagline", { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, 0.9);
      tl.to(".action-pill", { scale: 1.05, duration: 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.5);
      tl.to("#root", { opacity: 1, duration: 5.0 }, 0); // hold full duration

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
